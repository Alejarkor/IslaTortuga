services:
  postgres:
    image: postgres:16
    container_name: isla_tortuga_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: isla
      POSTGRES_PASSWORD: isla_password
      POSTGRES_DB: isla_tortuga
    ports:
      - "5432:5432"
    volumes:
      - isla_postgres_data:/var/lib/postgresql/data

volumes:
  isla_postgres_data: