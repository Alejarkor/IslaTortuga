<svg width="100%" viewBox="0 0 680 640" role="img" style="" xmlns="http://www.w3.org/2000/svg"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Viaje de un mensaje de input desde el cliente hasta que el sistema de gameplay correcto mueve al jugador correcto y el cambio se replica</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">El cliente manda un input, GameConnectionServer lo recibe como bytes en el socket, PlayerSessionManager identifica de qué jugador es, NetworkMessageRouter decide a qué sistema va, el MovementSystem dentro del tick valida y aplica el cambio sobre WorldState, y ReplicationManager envía el delta a los jugadores interesados.</desc>
