<svg width="100%" viewBox="0 0 680 700" role="img" style="" xmlns="http://www.w3.org/2000/svg"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Camino de conexión de un cliente al GameServer, desde abrir el socket hasta recibir el snapshot inicial, indicando qué submódulo interviene en cada paso</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">El cliente abre socket en GameConnectionServer, el ticket lo valida GameTicketValidator, PlayerSessionManager vincula socket con player_id y game_id, MatchRuntimeManager localiza la partida, y ReplicationManager envía el snapshot inicial. Después el jugador queda connected.</desc>
