<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Isla Tortuga · Cliente de prueba WS</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0e1622; color: #e6edf3; }
  header { padding: 12px 16px; background: #15233a; border-bottom: 1px solid #243; }
  h1 { font-size: 16px; margin: 0; }
  .wrap { display: grid; grid-template-columns: 1fr 360px; gap: 12px; padding: 12px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: #11192a; border: 1px solid #22324d; border-radius: 8px; padding: 12px; }
  label { display:block; font-size: 12px; color:#9fb3c8; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; background:#0c1422; color:#e6edf3; border:1px solid #2a3b58; border-radius:6px; }
  button { padding: 8px 12px; border:0; border-radius:6px; background:#2f6df0; color:#fff; cursor:pointer; margin-top:8px; }
  button.sec { background:#33415c; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; }
  canvas { width: 100%; background:#0a1120; border-radius:8px; display:block; outline:none; }
  .status { font-size:13px; padding:4px 8px; border-radius:12px; display:inline-block; }
  .s-off { background:#3a1f1f; color:#ff9d9d; }
  .s-on  { background:#16351f; color:#86efac; }
  #log { height: 180px; overflow:auto; font-family: ui-monospace, monospace; font-size:11px; background:#0a1120; border-radius:6px; padding:8px; white-space:pre-wrap; }
  .ent { font-size:12px; padding:4px 6px; border-bottom:1px solid #1c2a42; }
  .ent b { color:#86efac; }
  .muted { color:#7d93ab; font-size:12px; }
  .hint { color:#facc15; font-size:12px; margin:6px 0; }
</style>
</head>
<body>
<header><h1>🏴‍☠️ Isla Tortuga · cliente de prueba (WebSocket)</h1></header>
<div class="wrap">
  <div class="panel">
    <div id="status" class="status s-off">desconectado</div>
    <canvas id="view" width="640" height="420" tabindex="0"></canvas>
    <p class="hint">Haz clic en el lienzo y usa las <b>flechas</b> para mover tu punto (el amarillo). El servidor decide la posición y la replica con STATE_DELTA.</p>
    <div id="entities"></div>
  </div>
  <div class="panel">
    <label>Gateway (WebSocket)</label>
    <input id="url" value="ws://127.0.0.1:9090" />
    <label>Ticket (de "lanzar partida" en Postman)</label>
    <input id="ticket" placeholder="ticket_..." />
    <div class="row">
      <button id="connect">Conectar</button>
      <button id="disconnect" class="sec" disabled>Desconectar</button>
    </div>
    <label>Enviar mensaje crudo (JSON)</label>
    <input id="raw" placeholder='{"type":"PING"}' />
    <button id="send" class="sec" disabled>Enviar</button>
    <label>Registro</label>
    <div id="log"></div>
  </div>
</div>
<script>
(function () {
  var ws = null;
  var entities = new Map(); // id -> {prefabId, ownerId, authority, x, y, z}
  var myPlayerId = null;
  var seq = 0;
  var keys = { x: 0, z: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("view"), ctx = canvas.getContext("2d");

  function log(dir, text) {
    var el = $("log");
    var tag = dir === "in" ? "⬇" : dir === "out" ? "⬆" : "•";
    el.textContent += tag + " " + text + "\n";
    el.scrollTop = el.scrollHeight;
  }
  function setStatus(on, text) {
    var s = $("status");
    s.className = "status " + (on ? "s-on" : "s-off");
    s.textContent = text;
    $("connect").disabled = on;
    $("disconnect").disabled = !on;
    $("send").disabled = !on;
  }
  function send(obj) {
    if (!ws || ws.readyState !== 1) return;
    var msg = JSON.stringify(obj);
    ws.send(msg);
  }
  function hashOffset(id) {
    var h = 0; for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
    return { dx: (h % 13) - 6, dy: ((h >> 4) % 13) - 6 };
  }
  function render() {
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#16233a"; ctx.lineWidth = 1;
    for (var gx = 0; gx <= w; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
    for (var gy = 0; gy <= h; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }
    var cx = w / 2, cy = h / 2, scale = 18;
    ctx.fillStyle = "#33415c"; ctx.fillRect(cx - 2, cy - 2, 4, 4);
    entities.forEach(function (e, id) {
      var off = hashOffset(id);
      var px = cx + e.x * scale + off.dx;
      var py = cy + e.z * scale + off.dy;
      var mine = e.ownerId && e.ownerId === myPlayerId;
      ctx.beginPath();
      ctx.fillStyle = mine ? "#facc15" : (e.authority === "owner" ? "#86efac" : "#7aa2f7");
      ctx.arc(px, py, 10, 0, Math.PI * 2); ctx.fill();
      if (mine) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.fillStyle = "#cbd5e1"; ctx.font = "11px monospace";
      ctx.fillText((e.ownerId || e.prefabId) + (mine ? " (tú)" : ""), px + 13, py + 4);
    });
    var box = $("entities");
    box.innerHTML = "";
    if (entities.size === 0) { box.innerHTML = '<p class="muted">Sin entidades.</p>'; return; }
    entities.forEach(function (e, id) {
      var d = document.createElement("div");
      d.className = "ent";
      d.innerHTML = "<b>" + (e.ownerId || "—") + "</b> · " + e.prefabId +
        " · (" + e.x.toFixed(1) + ", " + e.y.toFixed(1) + ", " + e.z.toFixed(1) + ")";
      box.appendChild(d);
    });
  }
  function onMessage(text) {
    var m; try { m = JSON.parse(text); } catch (e) { log("in", text); return; }
    if (m.type === "MATCH_WELCOME") {
      myPlayerId = m.payload && m.payload.playerId;
      log("info", "MATCH_WELCOME: soy " + myPlayerId + " · match " + (m.payload && m.payload.matchId));
      send({ type: "CLIENT_READY_FOR_SNAPSHOT" });
    } else if (m.type === "SPAWN_ENTITY") {
      var p = m.payload || {}, pos = p.position || { x: 0, y: 0, z: 0 };
      entities.set(p.networkEntityId, { prefabId: p.networkPrefabId, ownerId: p.ownerId, authority: p.authority, x: pos.x || 0, y: pos.y || 0, z: pos.z || 0 });
      render();
    } else if (m.type === "DESPAWN_ENTITY") {
      entities.delete(m.payload && m.payload.networkEntityId);
      render();
    } else if (m.type === "STATE_DELTA") {
      var list = (m.payload && m.payload.entities) || [];
      for (var i = 0; i < list.length; i++) {
        var d = list[i], e = entities.get(d.id);
        if (e) { e.x = d.x; e.y = d.y; e.z = d.z; }
      }
      render();
    } else {
      log("in", text);
    }
  }
  function sendInput() {
    send({ type: "PLAYER_INPUT", payload: { seq: ++seq, moveX: keys.x, moveZ: keys.z, clientTime: Date.now() } });
  }
  var keyMap = { ArrowLeft: ["x", -1], ArrowRight: ["x", 1], ArrowUp: ["z", -1], ArrowDown: ["z", 1] };
  function onKey(down, ev) {
    var k = keyMap[ev.key];
    if (!k) return;
    ev.preventDefault();
    var v = down ? k[1] : 0;
    if (keys[k[0]] === v) return;
    keys[k[0]] = v;
    sendInput();
  }
  canvas.addEventListener("keydown", function (e) { onKey(true, e); });
  canvas.addEventListener("keyup", function (e) { onKey(false, e); });

  $("connect").onclick = function () {
    var url = $("url").value.trim(), ticket = $("ticket").value.trim();
    if (!ticket) { alert("Pega un ticket"); return; }
    entities.clear(); myPlayerId = null; seq = 0; keys = { x: 0, z: 0 }; render();
    try { ws = new WebSocket(url + "/?ticket=" + encodeURIComponent(ticket)); }
    catch (e) { alert("URL inválida"); return; }
    setStatus(false, "conectando…");
    ws.onopen = function () { setStatus(true, "conectado"); log("info", "WebSocket abierto"); canvas.focus(); };
    ws.onmessage = function (ev) { onMessage(ev.data); };
    ws.onclose = function () { setStatus(false, "desconectado"); log("info", "WebSocket cerrado"); };
    ws.onerror = function () { log("info", "error de WebSocket"); };
  };
  $("disconnect").onclick = function () { if (ws) ws.close(); };
  $("send").onclick = function () {
    var raw = $("raw").value.trim(); if (!raw) return;
    try { send(JSON.parse(raw)); } catch (e) { alert("JSON inválido"); }
  };
  render();
})();
</script>
</body>
</html>
