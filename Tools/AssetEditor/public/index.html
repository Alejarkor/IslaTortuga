<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IslaT · AssetEditor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐢</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">🐢</span>
        <div>
          <div class="brand-title">AssetEditor</div>
          <div class="brand-subtitle">Isla Tortuga</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="browser">
          <span class="nav-icon">🗂️</span> Explorador
        </button>
        <button class="nav-item" data-view="manifests">
          <span class="nav-icon">📜</span> Manifests
        </button>
        <button class="nav-item" data-view="sync">
          <span class="nav-icon">🔄</span> Sincronización
        </button>
        <button class="nav-item" data-view="log">
          <span class="nav-icon">📋</span> Registro
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="conn-status" id="conn-status">
          <span class="conn-dot" id="conn-dot"></span>
          <span id="conn-label">Comprobando…</span>
        </div>
        <div class="assets-root" id="assets-root" title=""></div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <h1 id="view-title">Explorador de assets</h1>
        <div class="topbar-actions">
          <button class="btn btn-primary" id="btn-scan">
            <span class="btn-icon">🔍</span> Escanear
          </button>
        </div>
      </header>

      <section id="view-container" class="view-container"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
